server {
    server_name oni.vn *.oni.vn; # Hỗ trợ domain chính và tất cả subdomain
    client_max_body_size 20M;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host; # Rất quan trọng để Next.js middleware nhận diện đúng tenant (host)
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/oni.vn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/oni.vn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host ~ ^[^.]+\.oni\.vn$) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = oni.vn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name oni.vn *.oni.vn;
    return 404; # managed by Certbot

}