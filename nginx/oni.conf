# ═══════════════════════════════════════════════════════════════
# Rate Limiting Zones (Security Audit Fix)
# ═══════════════════════════════════════════════════════════════
# Auth endpoints: 5 requests/minute per IP — chống brute-force
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
# Registration: 3 requests/minute per IP — chống spam
limit_req_zone $binary_remote_addr zone=register_limit:10m rate=3r/m;
# Registration live checks: 30 requests/minute per IP — validate realtime input
limit_req_zone $binary_remote_addr zone=register_check_limit:10m rate=30r/m;
# Webhooks: 50 requests/minute per IP — external services
limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=50r/m;
# General API: 100 requests/minute per IP — business operations
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;

server {
    server_name oni.vn *.oni.vn; # Hỗ trợ domain chính và tất cả subdomain

    client_max_body_size 20M;
    # Headroom cho các request có nhiều cookie chunk từ Supabase/SSR
    client_header_buffer_size 32k;
    large_client_header_buffers 8 64k;

    # ─── Auth endpoints (strict rate limit) ───────────────────
    location ~ ^/api/auth/(signin|signup)$ {
        limit_req zone=auth_limit burst=3 nodelay;
        limit_req_status 429;

        # pass cookie params
        proxy_buffer_size          128k;
        proxy_buffers              4 256k;
        proxy_busy_buffers_size    256k;
        #default
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Registration live checks (gentler rate limit) ────────
    location ~ ^/api/register/check-(code|slug)$ {
        limit_req zone=register_check_limit burst=10 nodelay;
        limit_req_status 429;

        # pass cookie params
        proxy_buffer_size          128k;
        proxy_buffers              4 256k;
        proxy_busy_buffers_size    256k;
        #default
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Registration endpoints (strict rate limit) ───────────
    location ~ ^/api/register {
        limit_req zone=register_limit burst=5 nodelay;
        limit_req_status 429;

        # pass cookie params
        proxy_buffer_size          128k;
        proxy_buffers              4 256k;
        proxy_busy_buffers_size    256k;
        #default
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Webhook endpoints (moderate rate limit) ──────────────
    location ~ ^/api/webhooks/ {
        limit_req zone=webhook_limit burst=10 nodelay;
        limit_req_status 429;

        # pass cookie params
        proxy_buffer_size          128k;
        proxy_buffers              4 256k;
        proxy_busy_buffers_size    256k;
        #default
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── General API (generous rate limit) ────────────────────
    # Excludes QR ordering routes (anonymous customer access)
    location ~ ^/api/(?!shops/[^/]+/qr-) {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        # pass cookie params
        proxy_buffer_size          128k;
        proxy_buffers              4 256k;
        proxy_busy_buffers_size    256k;
        #default
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tăng thời gian timeout cho các API xử lý lâu (như import)
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ─── Default (no rate limit for pages, QR, static assets) ─
    location / {
        # pass cookie params
        proxy_buffer_size          128k;
        proxy_buffers              4 256k;
        proxy_busy_buffers_size    256k;
        #default
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host; # Rất quan trọng để Next.js middleware nhận diện đúng tenant (host)
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tăng thời gian timeout
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/oni.vn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/oni.vn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host ~ ^[^.]+\.oni\.vn$) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = oni.vn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name oni.vn *.oni.vn;
    return 404; # managed by Certbot
}
